[package]
name = "fastqc-compliant-rs"
version = "0.4.0"
edition = "2021"
description = "A Rust translation of FastQC - quality control for high-throughput sequencing data"
license = "GPL-3.0"
repository = "https://github.com/henriksson-lab/fastqc-compliant-rs"
homepage = "https://github.com/henriksson-lab/fastqc-compliant-rs"
documentation = "https://docs.rs/fastqc-compliant-rs"
readme = "README.md"
keywords = ["fastqc", "bioinformatics", "sequencing", "quality-control"]
categories = ["command-line-utilities", "science"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/fastqc/test/data/*.fastq",
    "/fastqc/test/integration/*_fastqc_data.approved.txt",
    "/package/**",
]

[lib]
name = "fastqc_rs"
path = "src/lib.rs"

[[bin]]
name = "fastqc-compliant-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
bzip2 = "0.6"
rayon = "1"
zip = "2"
statrs = "0.18"
thiserror = "2"
base64 = "0.22"
noodles = { version = "0.88", features = ["bam", "sam", "bgzf", "core"] }
memchr = "2"
plotters = "0.3"
plotters-bitmap = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
iced = { version = "0.13", optional = true, features = ["image"] }
hdf5-pure-rust = "0.3"

[features]
default = []
gui = ["iced"]

[package.metadata.bundle]
name = "FastQC"
identifier = "uk.ac.babraham.fastqc-compliant-rs"
icon = ["package/fastqc-rs.ico"]
short_description = "Quality control for high-throughput sequencing data"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "fastqc-compliant-rs-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = false

[profile.bench]
lto = true
